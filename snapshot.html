<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot — WKND (Mockup)</title>
<style>
  :root{
    --accent:#3b63fb; --accent-deep:#2748d8; --ink:#131315; --sub:#6e6e77;
    --line:#e6e6ea; --bg:#fff; --soft:#f5f6fa; --soft2:#eef0f6;
    --ok:#0a7c42; --warn:#a86b00; --warn-bg:#fff4d6; --err:#c0392b;
    --sidebar:#14151a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--soft);}
  a{color:inherit;}

  .app{min-height:100vh;}

  /* sidebar (removed) */
  .side{background:var(--sidebar);color:#c7c9d1;padding:18px 12px;display:flex;flex-direction:column;gap:4px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;}
  .brand b{color:#fff;font-size:18px;letter-spacing:.06em;}
  .brand span{font-size:10px;color:#8b8e99;letter-spacing:.18em;text-transform:uppercase;}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:#c7c9d1;text-decoration:none;}
  .nav a:hover{background:#20222b;color:#fff;}
  .nav a.active{background:var(--accent);color:#fff;}
  .nav .ico{width:16px;text-align:center;opacity:.9;}
  .side .foot{margin-top:auto;font-size:11px;color:#6b6e79;padding:8px;}

  /* main */
  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{background:var(--bg);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{font-size:20px;}
  .topbar .site{font-size:12px;color:var(--sub);margin-top:2px;}
  .topbar .site code{background:var(--soft2);padding:1px 6px;border-radius:5px;}
  .content{padding:22px 26px;max-width:1180px;width:100%;margin:0 auto;}

  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tab{padding:10px 14px;border:none;background:none;color:var(--sub);font-weight:600;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--accent-deep);border-bottom-color:var(--accent);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;}
  .btn:hover{background:var(--soft);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-ghost{border-style:dashed;color:var(--sub);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .grid2{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start;}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px;}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:12px;}
  .label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px;}
  .input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
  .input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,99,251,.15);}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0;}

  .browse-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .folder-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--sub);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .plist{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;}
  .prow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;}
  .prow:last-child{border-bottom:none;}
  .prow:hover{background:var(--soft);}
  .prow .fld{color:var(--sub);}
  .count{font-size:12px;color:var(--accent-deep);font-weight:600;}

  .cart{position:sticky;top:20px;}
  .selbox{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:6px 0;}
  .selrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .selrow:last-child{border-bottom:none;}
  .selrow button{border:none;background:none;color:var(--err);cursor:pointer;font-size:15px;line-height:1;}
  .empty{color:var(--sub);font-size:12.5px;padding:14px;text-align:center;}

  /* review */
  .snaphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .snaphead strong{font-size:18px;}
  .status{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--soft2);color:var(--sub);font-weight:600;}
  .status.locked{background:var(--warn-bg);color:var(--warn);}
  .status.pub{background:#dcf5e8;color:var(--ok);}
  .rtable{width:100%;border-collapse:collapse;margin-top:8px;}
  .rtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:8px 10px;border-bottom:1px solid var(--line);}
  .rtable td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;}
  .rtable a{color:var(--accent-deep);text-decoration:none;}
  .rtable a:hover{text-decoration:underline;}
  .rev-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .placeholders{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .pchip{font-size:11px;padding:5px 11px;border-radius:999px;border:1px dashed var(--line);color:var(--sub);}

  /* review gallery */
  .rev-desc{color:var(--sub);font-size:13px;margin:4px 0 14px;}
  .gallery{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start;margin-top:12px;}
  .stage-frame{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;}
  .stage-frame iframe{display:block;width:100%;height:540px;border:0;background:#fff;}
  .gnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:999px;border:none;background:rgba(255,255,255,.82);color:#16171b;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;}
  .gnav:hover{background:#fff;}
  .gnav.prev{left:12px;}
  .gnav.next{right:12px;}
  .gcounter{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);color:#16171b;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;}
  .stage-path{margin-top:8px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:10px;}
  .stage-path code{background:var(--soft2);padding:1px 6px;border-radius:5px;}
  .stage-path a{color:var(--accent-deep);text-decoration:none;white-space:nowrap;}
  .rside-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin-bottom:8px;}
  .rlist{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .ritem{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:none;padding:9px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ritem:last-child{border-bottom:none;}
  .ritem:hover{background:var(--soft);}
  .ritem.active{background:var(--soft2);color:var(--accent-deep);font-weight:600;}
  .rev-decision{margin-top:14px;}
  .btn-deny{background:var(--err);border-color:var(--err);color:#fff;}
  .btn-deny:hover{background:#a5321f;}
  .deny-box{margin-top:12px;}
  .deny-box.hidden{display:none;}
  .deny-box textarea{width:100%;resize:vertical;margin-bottom:8px;font-family:inherit;}
  .deny-banner{background:#fdeeec;color:var(--err);border:1px solid #f3c9c2;border-radius:8px;padding:10px 12px;font-size:13px;margin:6px 0 12px;}
  .status.denied{background:#fdeeec;color:var(--err);}
  @media (max-width:820px){ .gallery{grid-template-columns:1fr;} }

  /* audit date filter + point-in-time */
  .audit-controls{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;}
  .audit-controls #asearch{max-width:280px;}
  .asof{display:flex;flex-direction:column;gap:4px;}
  .asof-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);}
  .pit-card{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#eef1fe;border:1px solid #cdd7fb;border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .pit-card.empty2{justify-content:flex-start;background:var(--soft);border-color:var(--line);color:var(--sub);font-size:13px;}
  .pit-when{font-size:12px;color:var(--sub);}
  .pit-name{font-size:15px;margin:2px 0;}
  .pit-sub{font-size:12px;color:var(--sub);}
  .amuted{color:var(--sub);font-size:12px;}
  .live-badge{font-size:10px;background:#dcf5e8;color:var(--ok);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;}
  tr.pit-active td{background:#f3f6ff;}

  /* bulk diff modal */
  .pchip-btn{cursor:pointer;font-family:inherit;}
  .pchip-btn:hover{background:var(--soft);border-color:var(--accent);color:var(--accent-deep);}
  .diff-modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .diff-modal.hidden{display:none;}
  .diff-panel{background:#fff;border-radius:14px;width:100%;max-width:1100px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .diff-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
  .diff-close{border:none;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--sub);}
  .diff-close:hover{color:var(--ink);}
  .diff-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;overflow:auto;}
  .diff-col{display:flex;flex-direction:column;gap:8px;}
  .diff-frame{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .diff-frame iframe{display:block;width:100%;height:460px;border:0;}
  @media (max-width:820px){ .diff-cols{grid-template-columns:1fr;} }

  /* audit */
  .atable{width:100%;border-collapse:collapse;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .atable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:11px 14px;background:var(--soft);}
  .atable td{padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px;}
  .atable tr.click{cursor:pointer;}
  .atable tr.click:hover td{background:var(--soft);}

  .note{font-size:12px;color:var(--sub);line-height:1.5;border-top:1px dashed var(--line);padding-top:12px;margin-top:16px;}
  .note code{background:var(--soft2);padding:1px 5px;border-radius:4px;}
  .mock-flag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:#ffe8cc;color:#a86b00;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.18);}
  .toast.hidden{display:none;}
  .toast.success{background:var(--ok);}
  .toast.warn{background:var(--warn);}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .side{flex-direction:row;overflow:auto;}
    .grid2{grid-template-columns:1fr;}
    .cart{position:static;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="topbar">
      <div>
        <h1>Snapshots <span class="mock-flag">Mockup</span></h1>
        <div class="site">Site: <code>blofft1 / wknd-advanced</code> · mockup, not connected to a live site</div>
      </div>
      <button class="btn btn-primary" id="new-snap">＋ New Snapshot</button>
    </div>

    <div class="content">
      <nav class="tabs">
        <button class="tab" data-tab="create">Create</button>
        <button class="tab" data-tab="review">Review</button>
        <button class="tab" data-tab="audit">Audit</button>
      </nav>
      <div id="body"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
/* ---------------- mock data ---------------- */
const ORG = 'blofft1', REPO = 'wknd-advanced';
const PAGES = [
  '/index',
  '/start-here/travel-planning-101','/start-here/trip-budgeting','/start-here/travel-safety-fund','/start-here/booking-smart',
  '/new-to-travel','/seasoned-explorer',
  '/learn/hiking','/learn/surfing','/learn/skiing','/learn/camping','/learn/city-escapes','/learn/road-trips',
  '/tools/adventure-savings','/tools/trip-readiness','/tools/trip-fund-planner',
  '/products/books','/products/courses','/products/tools',
  '/about-us','/events','/whats-coming-next',
  '/articles/best-fall-ridge-hikes','/articles/shoulder-season-surf','/articles/pacific-coast-road-trip',
];
const folderOf = (p) => { const parts = p.split('/').filter(Boolean); return parts.length > 1 ? parts[0] : 'root'; };
const FOLDERS = ['all', ...Array.from(new Set(PAGES.map(folderOf)))];

const state = {
  tab: 'create',
  filter: '',
  folder: 'all',
  auditQuery: '',
  auditDate: '',
  selected: new Set(['/index','/learn/hiking']),
  current: null,
  snapshots: [
    { name:'fall-collection-2026', description:'Autumn hiking + road-trip refresh', locked:true, status:'In review (locked)',
      pages:['/index','/start-here/travel-planning-101','/learn/hiking','/learn/road-trips','/articles/best-fall-ridge-hikes'], created:new Date('2026-09-18') },
    { name:'summer-sale-2026', description:'Booking promo across Start Here', locked:false, status:'Published',
      pages:['/start-here/booking-smart','/start-here/trip-budgeting','/index'], created:new Date('2026-07-02') },
    { name:'spring-refresh-2026', description:'Spring hiking + planning refresh', locked:false, status:'Published',
      pages:['/index','/learn/hiking','/start-here/travel-planning-101'], created:new Date('2026-04-10') },
    { name:'winter-guide-2026', description:'Winter road-trip guide launch', locked:false, status:'Published',
      pages:['/index','/learn/road-trips'], created:new Date('2026-01-15') },
  ],
};

/* ---------------- helpers ---------------- */
const esc = (s) => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const slug = (s) => (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const reviewsUrl = (name, path) => `https://${slug(name)}--main--${REPO}--${ORG}.aem.reviews${path}`;
const statusClass = (s) => s.status.startsWith('Published') ? 'pub' : (s.status.startsWith('Denied') ? 'denied' : (s.locked ? 'locked' : ''));

function toast(msg, type=''){ const t=document.getElementById('toast'); t.textContent=msg; t.className=`toast ${type}`; setTimeout(()=>t.classList.add('hidden'),4000); }
const escAttr = (s) => (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');

/* ---------------- page previews (mock mini-pages rendered in an iframe) ---------------- */
const IMG={
  mountain:'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1000&q=80',
  hiking:'https://images.unsplash.com/photo-1551632811-561732d1e306?w=1000&q=80',
  road:'https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=1000&q=80',
  ridge:'https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=1000&q=80',
  coast:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1000&q=80',
};
function pageDoc({kicker,title,img,fallback,intro,sections}){
  return `<!doctype html><html><head><meta charset="utf-8"><style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#16171b}
    .hero{position:relative;min-height:300px;display:flex;align-items:flex-end;padding:30px;color:#fff;background:${fallback};background-image:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.66)),url('${img}');background-size:cover;background-position:center}
    .kick{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.92;margin-bottom:10px}
    .hero h1{font-size:36px;line-height:1.08;max-width:660px}
    .body{padding:28px 30px;max-width:740px}
    .body p{margin:0 0 14px;line-height:1.65;color:#33343a}
    .body h2{font-size:21px;margin:24px 0 10px}
    .pill{display:inline-block;margin-top:18px;background:#e8532c;color:#fff;padding:11px 18px;border-radius:8px;font-weight:600;font-size:13px}
  </style></head><body>
    <div class="hero"><div><div class="kick">${kicker}</div><h1>${title}</h1></div></div>
    <div class="body">${intro?`<p>${intro}</p>`:''}${(sections||[]).map(s=>`<h2>${s.h}</h2><p>${s.p}</p>`).join('')}<span class="pill">Start planning ›</span></div>
  </body></html>`;
}
const PREVIEWS={
  '/index':pageDoc({kicker:'Explore · Wander · Belong',title:'Real Trips. Real Routes. This Weekend.',img:IMG.mountain,fallback:'linear-gradient(135deg,#0C2A22,#2FA8A0)',intro:"The best weekends aren't bought, they're lived. Every guide on WKND is built from routes our team has actually walked, ridden, or paddled.",sections:[{h:'The Idea',p:'Honest prep, clear difficulty ratings, and first-hand route notes so you can go prepared and come back wanting more.'},{h:'Why WKND',p:'No hype, no gatekeeping — just the trailhead details that actually matter.'}]}),
  '/start-here/travel-planning-101':pageDoc({kicker:'Start Here',title:'Trip Planning 101',img:IMG.ridge,fallback:'linear-gradient(135deg,#123A2F,#F4A73B)',intro:'Turn a daydream into a trip you can actually take — with a clear goal and a simple, repeatable plan.',sections:[{h:'The three numbers',p:'Your trip cost, your savings rate, and your trip-fund target.'},{h:'Timing matters',p:'Shoulder seasons stretch your budget and thin the crowds.'}]}),
  '/learn/hiking':pageDoc({kicker:'Trip Types',title:'Hiking',img:IMG.hiking,fallback:'linear-gradient(135deg,#0C2A22,#2FA8A0)',intro:'From easy loops to alpine ridgelines — pick a route that matches your level and go prepared.',sections:[{h:'Know before you go',p:'Check current conditions, permits, and honest difficulty ratings.'},{h:'Pack smart',p:'Layers, water, navigation, and the ten essentials.'}]}),
  '/learn/road-trips':pageDoc({kicker:'Trip Types',title:'Road Trips',img:IMG.road,fallback:'linear-gradient(135deg,#14110F,#E8532C)',intro:'Great drives with honest logistics — map the big stops and leave room to wander.',sections:[{h:'Plan the route',p:'Anchor the must-sees, then keep the itinerary loose.'},{h:'Best seasons',p:'Beat the crowds with shoulder-season timing.'}]}),
  '/articles/best-fall-ridge-hikes':pageDoc({kicker:'Article',title:'Best Fall Ridge Hikes',img:IMG.coast,fallback:'linear-gradient(135deg,#123A2F,#F4A73B)',intro:'Crisp air, gold larches, and big views — our favorite ridgelines for peak fall color.',sections:[{h:'Franconia Ridge Loop',p:'A classic White Mountains traverse above treeline.'},{h:'When to go',p:'Early October, typically, for peak color and stable weather.'}]}),
};
function previewDoc(path){
  if (PREVIEWS[path]) return PREVIEWS[path];
  const title=(path.split('/').pop()||'Page').replace(/-/g,' ').replace(/\b\w/g,(c)=>c.toUpperCase());
  return pageDoc({kicker:'WKND',title,img:IMG.mountain,fallback:'linear-gradient(135deg,#0C2A22,#2FA8A0)',intro:`Preview of ${path}.`,sections:[{h:'Overview',p:'Sample content for this page in the snapshot.'}]});
}

/* ---------------- render ---------------- */
const body = document.getElementById('body');
function setTab(t){ state.tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); render(); }
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.getElementById('new-snap').addEventListener('click',()=>{ state.current=null; setTab('create'); });

function render(){
  if(state.tab==='create') renderCreate();
  if(state.tab==='review') renderReview();
  if(state.tab==='audit') renderAudit();
}

function renderCreate(){
  body.innerHTML = `
    <div class="grid2">
      <div class="card">
        <div class="browse-head"><h2 style="margin:0">Browse content</h2><span class="count" id="cnt">${state.selected.size} selected</span></div>
        <input class="input" id="filter" placeholder="Filter pages…" value="${esc(state.filter)}">
        <div class="folder-chips" id="chips">${FOLDERS.map(f=>`<span class="chip ${state.folder===f?'active':''}" data-f="${f}">${f}</span>`).join('')}</div>
        <div class="plist" id="plist"></div>
      </div>
      <div class="card cart">
        <h2>New snapshot</h2>
        <label class="label">Name</label>
        <input class="input" id="snap-name" placeholder="e.g. fall-collection-2026">
        <label class="label">Description</label>
        <input class="input" id="snap-desc" placeholder="What's in this release?">
        <label class="check"><input type="checkbox" id="snap-lock" checked> Lock pages during review</label>
        <label class="label">Selected pages <span class="count" id="selcnt">${state.selected.size}</span></label>
        <div class="selbox" id="selbox"></div>
        <button class="btn btn-primary" id="create" style="width:100%;justify-content:center;margin-top:10px">Create Snapshot</button>
        <p class="note">Snapshots are multi-page by default. Creating stages them on the <code>.aem.reviews</code> environment for review before publish.</p>
      </div>
    </div>`;

  const plist = body.querySelector('#plist');
  const paintList = () => {
    const q = state.filter.toLowerCase();
    const rows = PAGES.filter(p => (state.folder==='all'||folderOf(p)===state.folder) && (!q||p.toLowerCase().includes(q)));
    plist.innerHTML = rows.length ? rows.map(p=>{
      const parts=p.split('/'); const name=parts.pop(); const fld=parts.join('/')||'/';
      return `<label class="prow"><input type="checkbox" data-p="${p}" ${state.selected.has(p)?'checked':''}><span>${esc(name)}</span><span class="fld">${esc(fld)}</span></label>`;
    }).join('') : '<div class="empty">No pages match.</div>';
    plist.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
      if(cb.checked) state.selected.add(cb.dataset.p); else state.selected.delete(cb.dataset.p);
      paintCart();
    }));
  };
  const paintCart = () => {
    body.querySelector('#cnt').textContent = `${state.selected.size} selected`;
    body.querySelector('#selcnt').textContent = state.selected.size;
    const sb = body.querySelector('#selbox');
    const arr=[...state.selected];
    sb.innerHTML = arr.length ? arr.map(p=>`<div class="selrow"><span>${esc(p)}</span><button data-p="${p}" title="remove">×</button></div>`).join('') : '<div class="empty">No pages selected yet.</div>';
    sb.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.selected.delete(b.dataset.p);paintList();paintCart();}));
  };

  body.querySelector('#filter').addEventListener('input',e=>{state.filter=e.target.value;paintList();});
  body.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{state.folder=c.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.f===state.folder));paintList();}));
  body.querySelector('#create').addEventListener('click',()=>{
    const name=body.querySelector('#snap-name').value;
    if(!slug(name)){toast('Enter a snapshot name.','warn');return;}
    if(state.selected.size<1){toast('Select at least one page.','warn');return;}
    const locked=body.querySelector('#snap-lock').checked;
    const snap={name:slug(name),description:body.querySelector('#snap-desc').value,locked,status:locked?'In review (locked)':'Draft',pages:[...state.selected],created:new Date()};
    state.snapshots.unshift(snap); state.current=snap; state.selected=new Set();
    setTab('review'); toast(`Snapshot "${snap.name}" created with ${snap.pages.length} pages ✓`,'success');
  });
  paintList(); paintCart();
}

function renderReview(){
  const s=state.current;
  if(!s){ body.innerHTML='<div class="card"><div class="empty">Create a snapshot, or open one from the Audit tab.</div></div>'; return; }
  if(typeof s.idx!=='number' || s.idx>=s.pages.length) s.idx=0;
  const path=s.pages[s.idx];
  const denied=(s.status||'').startsWith('Denied');

  body.innerHTML = `
    <div class="card">
      <div class="snaphead"><strong>${esc(s.name)}</strong><span class="status ${statusClass(s)}">${esc(s.status)}</span></div>
      ${s.description?`<p class="rev-desc">${esc(s.description)}</p>`:''}
      ${denied && s.denyReason?`<div class="deny-banner"><strong>Denied:</strong> ${esc(s.denyReason)}</div>`:''}
      <div class="gallery">
        <div class="stage">
          <div class="stage-frame">
            <iframe title="page preview" srcdoc="${escAttr(previewDoc(path))}"></iframe>
            <button class="gnav prev" id="gprev" aria-label="Previous page">‹</button>
            <button class="gnav next" id="gnext" aria-label="Next page">›</button>
            <div class="gcounter">${s.idx+1} / ${s.pages.length}</div>
          </div>
          <div class="stage-path"><code>${esc(path)}</code><a href="https://main--${REPO}--${ORG}.aem.live${path}" target="_blank" rel="noopener">open live ↗</a></div>
        </div>
        <div class="rside">
          <div class="rside-head"><span>Pages</span><span class="count">${s.pages.length}</span></div>
          <div class="rlist">
            ${s.pages.map((p,i)=>`<button class="ritem ${i===s.idx?'active':''}" data-i="${i}" title="${esc(p)}">${esc(p)}</button>`).join('')}
          </div>
          <div class="rev-decision">
            <p class="rev-desc" style="margin:0 0 8px">Approve or deny the whole snapshot:</p>
            <div class="rev-actions">
              <button class="btn btn-primary" id="approve-pub">Approve &amp; Publish</button>
              <button class="btn btn-deny" id="deny-btn">Deny</button>
            </div>
            <div class="deny-box hidden" id="deny-box">
              <label class="label" for="deny-msg">Reason for denial</label>
              <textarea class="input" id="deny-msg" rows="4" placeholder="Explain what needs to change before this snapshot can be approved…"></textarea>
              <div class="rev-actions">
                <button class="btn btn-deny" id="deny-send">Send Denial</button>
                <button class="btn btn-ghost" id="deny-cancel">Cancel</button>
              </div>
            </div>
          </div>
          <div class="placeholders">
            <button class="pchip pchip-btn" id="diff-btn">🔀 Bulk diff</button>
          </div>
        </div>
      </div>
      <p class="note">Move through pages with the arrows or the list. Approve or deny the <strong>entire snapshot</strong>; a denial sends your message back to the author. Reviewers view each page on <code>.aem.reviews</code>. (Mockup — actions update state only.)</p>
    </div>
    <div id="diff-modal" class="diff-modal hidden">
      <div class="diff-panel">
        <div class="diff-head"><strong>Bulk diff — compare pages</strong><button class="diff-close" id="diff-close" aria-label="Close">×</button></div>
        <div class="diff-cols">
          <div class="diff-col"><select class="input diff-sel" id="diff-left"></select><div class="diff-frame"><iframe id="diff-left-frame" title="left page"></iframe></div></div>
          <div class="diff-col"><select class="input diff-sel" id="diff-right"></select><div class="diff-frame"><iframe id="diff-right-frame" title="right page"></iframe></div></div>
        </div>
      </div>
    </div>`;

  const go=(i)=>{ s.idx=(i+s.pages.length)%s.pages.length; renderReview(); };
  body.querySelector('#gprev').addEventListener('click',()=>go(s.idx-1));
  body.querySelector('#gnext').addEventListener('click',()=>go(s.idx+1));
  body.querySelectorAll('.ritem').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.i))));

  body.querySelector('#approve-pub').addEventListener('click',()=>{ s.status='Published'; s.locked=false; s.denyReason=''; render(); toast('Snapshot approved & published ✓','success'); });
  const denyBox=body.querySelector('#deny-box');
  body.querySelector('#deny-btn').addEventListener('click',()=>{ denyBox.classList.toggle('hidden'); if(!denyBox.classList.contains('hidden')) body.querySelector('#deny-msg').focus(); });
  body.querySelector('#deny-cancel').addEventListener('click',()=>denyBox.classList.add('hidden'));
  body.querySelector('#deny-send').addEventListener('click',()=>{
    const msg=body.querySelector('#deny-msg').value.trim();
    if(!msg){ toast('Add a reason before sending the denial.','warn'); return; }
    s.status='Denied'; s.locked=false; s.denyReason=msg; render(); toast('Denial sent to author ✕','warn');
  });

  // Bulk diff — compare two pages side by side
  const diffModal=body.querySelector('#diff-modal');
  const opts=s.pages.map((p)=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  const leftSel=body.querySelector('#diff-left');
  const rightSel=body.querySelector('#diff-right');
  leftSel.innerHTML=opts; rightSel.innerHTML=opts;
  leftSel.value=s.pages[s.idx];
  rightSel.value=s.pages[(s.idx+1)%s.pages.length];
  const setFrame=(sel,val)=>{ body.querySelector(sel).srcdoc=previewDoc(val); };
  body.querySelector('#diff-btn').addEventListener('click',()=>{
    diffModal.classList.remove('hidden');
    setFrame('#diff-left-frame',leftSel.value);
    setFrame('#diff-right-frame',rightSel.value);
  });
  body.querySelector('#diff-close').addEventListener('click',()=>diffModal.classList.add('hidden'));
  diffModal.addEventListener('click',(e)=>{ if(e.target===diffModal) diffModal.classList.add('hidden'); });
  leftSel.addEventListener('change',()=>setFrame('#diff-left-frame',leftSel.value));
  rightSel.addEventListener('change',()=>setFrame('#diff-right-frame',rightSel.value));
}

function activeAsOf(when){
  const t=new Date(when).getTime();
  if(isNaN(t)) return null;
  return state.snapshots
    .filter(s=>String(s.status).startsWith('Published') && s.created.getTime()<=t)
    .sort((a,b)=>b.created-a.created)[0] || null;
}
function openSnapshot(snap){ if(!snap) return; state.current=snap; snap.idx=0; setTab('review'); }

function renderAudit(){
  body.innerHTML = `
    <div class="audit-controls">
      <input class="input" id="asearch" placeholder="Search by name…" value="${esc(state.auditQuery)}">
      <div class="asof">
        <label class="asof-label" for="asof">View site as of</label>
        <input class="input" id="asof" type="datetime-local" value="${esc(state.auditDate)}">
      </div>
      <button class="btn btn-ghost" id="aclear">Clear</button>
    </div>
    <div id="pit"></div>
    <table class="atable"><thead><tr><th>Name</th><th>Pages</th><th>Created</th><th>Status</th></tr></thead><tbody id="arows"></tbody></table>
    <p class="note">Pick a date &amp; time to travel back: the audit shows the snapshots that existed by then and which one the live site reflected at that moment. <strong>View site at this moment</strong> opens that snapshot's pages. Live version reconstructs from the <code>/snapshot</code> history.</p>`;

  const pit=body.querySelector('#pit');
  const paintPit=()=>{
    if(!state.auditDate){ pit.innerHTML=''; return; }
    const active=activeAsOf(state.auditDate);
    const when=new Date(state.auditDate).toLocaleString();
    pit.innerHTML = active
      ? `<div class="pit-card"><div><div class="pit-when">As of ${esc(when)}</div><div class="pit-name">Live site reflected: <strong>${esc(active.name)}</strong></div><div class="pit-sub">Published ${active.created.toLocaleDateString()} · ${active.pages.length} pages</div></div><button class="btn btn-primary" id="pit-view">View site at this moment</button></div>`
      : `<div class="pit-card empty2">No published snapshot was live before ${esc(when)}.</div>`;
    const v=body.querySelector('#pit-view');
    if(v) v.addEventListener('click',()=>openSnapshot(active));
  };

  const paint=()=>{
    const q=(state.auditQuery||'').toLowerCase();
    const t=state.auditDate?new Date(state.auditDate).getTime():null;
    const active=state.auditDate?activeAsOf(state.auditDate):null;
    const rows=state.snapshots.filter(s=>(!q||s.name.includes(q)) && (t===null||isNaN(t)||s.created.getTime()<=t));
    const tb=body.querySelector('#arows');
    tb.innerHTML=rows.length?rows.map(s=>`<tr class="click ${active&&s===active?'pit-active':''}" data-n="${esc(s.name)}"><td><strong>${esc(s.name)}</strong>${active&&s===active?' <span class="live-badge">live then</span>':''}<div class="amuted">${esc(s.description||'')}</div></td><td>${s.pages.length}</td><td>${s.created.toLocaleDateString()}</td><td><span class="status ${statusClass(s)}">${esc(s.status)}</span></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">No snapshots match.</div></td></tr>';
    tb.querySelectorAll('tr.click').forEach(r=>r.addEventListener('click',()=>openSnapshot(state.snapshots.find(s=>s.name===r.dataset.n))));
  };

  body.querySelector('#asearch').addEventListener('input',e=>{state.auditQuery=e.target.value;paint();});
  body.querySelector('#asof').addEventListener('change',e=>{state.auditDate=e.target.value;paintPit();paint();});
  body.querySelector('#aclear').addEventListener('click',()=>{state.auditQuery='';state.auditDate='';renderAudit();});
  paintPit(); paint();
}

setTab('create');
</script>
</body>
</html>
