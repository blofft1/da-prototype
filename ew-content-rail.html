<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience Workspace — Compose a page (Spectrum 2 concept)</title>
<style>
  :root{
    --gray-25:#fdfdfd;--gray-50:#f8f8f8;--gray-75:#f3f3f3;--gray-100:#eeeeee;--gray-200:#e4e4e4;
    --gray-300:#d3d3d3;--gray-400:#b6b6b6;--gray-500:#8f8f8f;--gray-600:#6d6d6d;--gray-700:#4a4a4a;--gray-800:#2b2b2b;--gray-900:#181818;
    --accent:#3b63fb;--accent-hover:#2f4fd6;--accent-wash:#eef1ff;--accent-border:#c7d2ff;
    --pos:#0a8055;--pos-wash:#e6f5ee;--notice:#b8730b;--notice-wash:#fbefda;--neg:#cf2a25;--info:#0a6cd6;--info-wash:#e6f0fd;
    --purple:#7c4bd6;--purple-wash:#efe7fb;
    --radius-s:8px;--radius-m:12px;--radius-l:16px;--radius-pill:999px;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(20,24,40,.06);
    --shadow-hover:0 3px 8px rgba(0,0,0,.09),0 16px 36px rgba(20,24,40,.13);
    --font:'adobe-clean','Adobe Clean',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--gray-100);color:var(--gray-900);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:inherit;text-decoration:none}
  .app{height:100vh;display:flex;flex-direction:column}

  .appbar{height:52px;background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:14px;padding:0 14px;flex:0 0 52px}
  .alogo{width:28px;height:28px;background:#EB1000;border-radius:7px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
  .crumb{font-size:13.5px;color:var(--gray-600);display:flex;align-items:center;gap:7px}
  .crumb b{color:var(--gray-900)}
  .spacer{flex:1}
  .concept{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--accent-wash);border:1px solid var(--accent-border);padding:3px 8px;border-radius:var(--radius-pill);text-transform:uppercase}
  .actions{display:flex;align-items:center;gap:4px;padding:3px;background:var(--gray-75);border:1px solid var(--gray-200);border-radius:var(--radius-pill)}
  .actbtn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--gray-700);padding:6px 11px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap}
  .actbtn:hover{background:#fff;color:var(--gray-900);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .actbtn svg{width:14px;height:14px}
  .send{background:var(--accent);color:#fff;font-weight:700;font-size:13px;border:none;border-radius:var(--radius-pill);padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6b8cff,#3b63fb);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

  .body{flex:1;display:flex;min-height:0}
  .iconrail{width:48px;flex:0 0 48px;background:#fff;border-right:1px solid var(--gray-200);display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:16px;color:var(--gray-500)}
  .iconrail svg{width:22px;height:22px;cursor:pointer}

  .canvaswrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--gray-100)}
  .subbar{height:44px;flex:0 0 44px;background:#fff;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:12px;padding:0 16px}
  .seg{display:inline-flex;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:var(--radius-pill);padding:3px;gap:2px}
  .seg button{border:none;background:transparent;font-family:var(--font);font-weight:700;font-size:12px;color:var(--gray-600);padding:6px 13px;border-radius:var(--radius-pill);cursor:pointer}
  .seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.10)}
  .ib{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--gray-600);cursor:pointer}
  .ib:hover{background:var(--gray-75)}
  .canvasscroll{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center}
  .page{width:820px;max-width:100%;background:#fff;border-radius:var(--radius-l);box-shadow:var(--shadow);overflow:hidden;min-height:560px;align-self:flex-start}
  .page.pageselected{outline:2px solid var(--accent);outline-offset:2px}

  /* empty template */
  .emptystate{min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--gray-500);text-align:center;padding:40px}
  .emptystate .big{width:64px;height:64px;border-radius:16px;background:var(--accent-wash);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .emptystate .big svg{width:30px;height:30px}
  .emptystate h3{font-size:17px;color:var(--gray-800)}
  .emptystate p{font-size:13.5px;max-width:340px}
  .emptystate.hot{background:var(--accent-wash);outline:2px dashed var(--accent);outline-offset:-12px}

  /* rendered blocks */
  .cblock{position:relative;cursor:pointer;border:2px solid transparent}
  .cblock .blabel{position:absolute;top:6px;left:8px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:rgba(20,24,40,.55);padding:2px 8px;border-radius:var(--radius-pill);z-index:5;opacity:0;transition:.12s}
  .cblock:hover .blabel{opacity:1}
  .cblock.sel{border-color:var(--accent);border-radius:6px}
  .cblock.sel .blabel{opacity:1;background:var(--accent)}
  .cblock.drophot{outline:3px dashed var(--accent);outline-offset:-6px;background:var(--accent-wash)}

  .c-hero{min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:34px;color:#fff;background-size:cover;background-position:center;position:relative}
  .c-hero.noimg{background:repeating-linear-gradient(45deg,#eef1ff,#eef1ff 12px,#e4e9ff 12px,#e4e9ff 24px);color:var(--gray-600);align-items:center;justify-content:center;text-align:center}
  .c-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55));z-index:0}
  .c-hero.noimg::after{display:none}
  .c-hero>*{position:relative;z-index:1}
  .c-hero .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.92;margin-bottom:8px}
  .c-hero h1{line-height:1.08;letter-spacing:-.5px;max-width:80%}
  .c-hero .subhead{margin-top:12px;font-size:15px;opacity:.94;max-width:70%}
  .c-hero .hcta{margin-top:18px;display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--gray-900);font-weight:700;font-size:13px;padding:9px 16px;border-radius:var(--radius-pill);width:max-content}
  .c-hero .imgdrop{border:2px dashed var(--accent-border);border-radius:12px;padding:14px 20px;color:var(--accent);font-weight:700;font-size:13px;background:#fff}

  .c-cards{padding:26px 30px}
  .c-cards h2{font-size:20px;margin-bottom:16px;letter-spacing:-.3px}
  .c-cardrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tc{border:1px solid var(--gray-200);border-radius:var(--radius-m);overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .tc .tcimg{height:140px;background:var(--gray-100);background-size:cover;background-position:center}
  .tc .tcb{padding:13px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
  .tc .tcb b{font-size:15px;letter-spacing:-.2px}
  .tc .tcb p{font-size:12.5px;color:var(--gray-600);line-height:1.4}
  .tc .tcb .cta{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px;padding-top:4px}
  .c-cardrow .slot{border:2px dashed var(--accent-border);border-radius:var(--radius-m);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-weight:700;font-size:12px;background:var(--accent-wash);text-align:center;padding:12px}
  .c-cardrow .slot svg{width:20px;height:20px}

  .c-generic{padding:26px 30px}
  .c-generic .gbox{border:1.5px dashed var(--gray-300);border-radius:var(--radius-m);padding:26px;text-align:center;color:var(--gray-500);font-size:13px}
  .c-generic .gbox b{color:var(--gray-700);font-size:14px;display:block;margin-bottom:3px}
  .c-image img{width:100%;display:block}
  .c-divider{padding:8px 30px}.c-divider hr{border:none;border-top:1px solid var(--gray-200)}

  /* ============ RIGHT RAIL ============ */
  .rail{width:400px;flex:0 0 400px;background:#fff;border-left:1px solid var(--gray-200);display:flex;flex-direction:column;min-height:0}
  .railtabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--gray-100)}
  .railtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 9px;font-size:11px;font-weight:700;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
  .railtab svg{width:18px;height:18px}
  .railtab:hover{color:var(--gray-800);background:var(--gray-75)}
  .railtab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .railbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  .csearch{display:flex;align-items:center;gap:9px;margin:14px 14px 10px;background:var(--gray-75);border:1.5px solid var(--gray-200);border-radius:var(--radius-pill);padding:10px 14px}
  .csearch:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-wash)}
  .csearch svg{flex:0 0 16px;color:var(--gray-500)}
  .csearch input{border:none;outline:none;background:transparent;font-family:var(--font);font-size:13.5px;flex:1}
  .srcfilter{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
  .srcchip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gray-700);background:var(--gray-75);border:1px solid var(--gray-200);border-radius:var(--radius-pill);padding:6px 12px;cursor:pointer}
  .srcchip .sd{width:7px;height:7px;border-radius:2px}
  .srcchip:hover{border-color:var(--accent);color:var(--accent)}
  .srcchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .srcchip.on .sd{background:#fff !important}
  .ctxbar{margin:0 14px 10px;display:flex;align-items:center;gap:9px;background:var(--accent-wash);border:1px solid var(--accent-border);border-radius:var(--radius-s);padding:8px 12px;font-size:12px;color:var(--gray-800)}
  .ctxbar svg{width:15px;height:15px;color:var(--accent);flex:0 0 15px}
  .ctxbar b{color:var(--accent)}
  .reslist{flex:1;overflow:auto;padding:2px 12px 14px}
  .subhead2{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gray-500);margin:12px 2px 8px;display:flex;align-items:center;gap:8px}
  .subhead2 .ln{flex:1;height:1px;background:var(--gray-100)}

  .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bitem{position:relative;border:1px solid var(--gray-200);border-radius:var(--radius-m);padding:12px;cursor:grab;background:#fff;display:flex;flex-direction:column;gap:9px;transition:box-shadow .12s,transform .12s}
  .bitem:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--gray-300)}
  .bthumb{height:58px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-wash);color:var(--accent)}
  .bthumb svg{width:26px;height:26px}
  .bitem .bn{font-size:12.5px;font-weight:700}
  .bitem .bo{font-size:10.5px;color:var(--gray-500);font-weight:600}

  /* asset thumbs (real images) */
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .aitem{position:relative;border:1px solid var(--gray-200);border-radius:var(--radius-m);overflow:hidden;cursor:grab;background:#fff;transition:box-shadow .12s,transform .12s}
  .aitem:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
  .aitem .aimg{height:96px;background-size:cover;background-position:center;background-color:var(--gray-100)}
  .aitem .ab{padding:8px 10px}
  .aitem .an{font-size:11.5px;font-weight:700;word-break:break-word}
  .aitem .ao{font-size:10px;color:var(--purple);font-weight:700;margin-top:2px}
  .abadge{position:absolute;top:8px;left:8px;background:var(--purple);color:#fff;font-size:9px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:var(--radius-pill)}

  /* fragment content rows (searchable, with preview) */
  .fitem{display:flex;gap:12px;border:1px solid var(--gray-200);border-radius:var(--radius-m);padding:10px;cursor:grab;background:#fff;margin-bottom:10px;transition:box-shadow .12s,transform .12s;align-items:stretch}
  .fitem:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--gray-300)}
  .fprev{width:88px;flex:0 0 88px;border-radius:8px;background-size:cover;background-position:center;background-color:var(--gray-100)}
  .fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .ftop{display:flex;align-items:center;gap:7px}
  .ftag{font-size:9px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;background:var(--notice-wash);color:var(--notice);padding:2px 7px;border-radius:var(--radius-pill)}
  .fbody .ft{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
  .fbody .fd{font-size:11.5px;color:var(--gray-600);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fmeta{font-size:10.5px;color:var(--gray-500);font-weight:600;display:flex;gap:10px;margin-top:2px}
  .gridcount{padding:8px 15px;border-top:1px solid var(--gray-100);font-size:11px;color:var(--gray-500);display:flex;justify-content:space-between}

  /* properties */
  .stub{padding:14px 15px;overflow:auto}
  .stub h4{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--gray-600);margin:2px 0 12px;display:flex;align-items:center;gap:8px}
  .stub h4 .pill{margin-left:auto;font-size:10px;background:var(--accent-wash);color:var(--accent);border-radius:var(--radius-pill);padding:2px 8px}
  details{border:1px solid var(--gray-200);border-radius:var(--radius-m);margin-bottom:10px;overflow:hidden}
  details>summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;background:var(--gray-50)}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--gray-500);border-bottom:2px solid var(--gray-500);transform:rotate(-45deg);transition:.15s;margin-right:2px}
  details[open]>summary::before{transform:rotate(45deg)}
  details .dc{padding:12px 13px}
  .field{margin-bottom:13px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--gray-700);margin-bottom:5px}
  .field input[type=text],.field textarea,.field .selctrl{width:100%;border:1px solid var(--gray-300);border-radius:var(--radius-s);padding:9px 11px;font-family:var(--font);font-size:13px;color:var(--gray-900);background:#fff;outline:none}
  .field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .field textarea{resize:vertical;min-height:60px;line-height:1.4}
  .field .selctrl{display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:var(--gray-500)}
  .field .selctrl.set{color:var(--gray-900)}
  .field .help{font-size:11px;color:var(--gray-500);margin-top:5px;line-height:1.4}
  .pseg{display:inline-flex;flex-wrap:wrap;gap:4px}
  .pseg button{border:1px solid var(--gray-300);background:#fff;font-family:var(--font);font-weight:700;font-size:12px;color:var(--gray-700);padding:6px 12px;border-radius:var(--radius-s);cursor:pointer}
  .pseg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .imgprop{display:flex;gap:11px;align-items:center}
  .imgprop .ipthumb{width:64px;height:48px;border-radius:8px;background-size:cover;background-position:center;background:var(--gray-100);flex:0 0 64px;border:1px solid var(--gray-200)}
  .imgprop .ipmeta{font-size:12px}.imgprop .ipmeta b{font-size:12.5px}.imgprop .ipmeta span{color:var(--gray-500);font-size:11px}
  .imgprop .ipnone{color:var(--gray-500);font-size:12px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gray-900);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:var(--radius-pill);box-shadow:0 8px 30px rgba(0,0,0,.28);opacity:0;transition:.2s;z-index:100;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px;height:16px;color:#7ee0b0}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="alogo">A</div>
    <div class="crumb">blofft1 <span>›</span> wknd-advanced <span>›</span> <b>new-page</b></div>
    <span class="concept">Concept · Spectrum 2</span>
    <div class="spacer"></div>
    <div class="actions">
      <div class="actbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 3v4M3 5h4M13 3l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg> Generate Variations</div>
      <div class="actbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20.6 13.4 12 22l-9-9V4h9z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></svg> Tag</div>
      <div class="actbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 4h16v12H5.2L4 17.5z"/><path d="M8 9h8M8 12h5"/></svg> Request Publish</div>
    </div>
    <button class="send"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l16-8-6 16-3-6-7-2z"/></svg> Send</button>
    <div class="avatar">BL</div>
  </header>

  <div class="body">
    <div class="iconrail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10c-.7.7-1 1.5-1 2H9c0-.5-.3-1.3-1-2A6 6 0 0 1 12 3z"/></svg>
    </div>

    <div class="canvaswrap">
      <div class="subbar">
        <div class="seg"><button class="on">Layout</button><button>Content</button></div>
        <div class="ib" title="Undo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></div>
        <div class="ib" title="Redo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></div>
        <div class="spacer"></div>
        <div class="ib" title="Preview"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg></div>
      </div>
      <div class="canvasscroll">
        <div class="page" id="page"></div>
      </div>
    </div>

    <aside class="rail">
      <div class="railtabs" id="railtabs">
        <div class="railtab on" data-mode="content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Content</div>
        <div class="railtab" data-mode="outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Outline</div>

function blockCard(b){return `<div class="bitem" draggable="true" data-kind="block" data-block="${b.k}"><div class="bthumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${G[b.k]}</svg></div><div class="bn">${b.n}</div><div class="bo">Library block</div></div>`;}

function tripRow(t,i){return `<div class="fitem" draggable="true" data-kind="fragment" data-idx="${i}"><div class="fprev" style="background-image:url('${t.img}')"></div><div class="fbody"><div class="ftop"><span class="ftag">Trip · fragment</span></div><div class="ft">${t.t}</div><div class="fd">${t.d}</div><div class="fmeta"><span>◍ ${t.r}</span><span>❄ ${t.s}</span></div></div></div>`;}
function matchTrip(t){const s=(t.t+' '+t.d+' '+t.r+' '+t.s).toLowerCase();return !q||s.includes(q.toLowerCase());}
function matchBlock(b){return !q||b.n.toLowerCase().includes(q.toLowerCase());}
function matchAsset(a){const s=(a.f+' '+a.alt+' '+a.folder).toLowerCase();return (!q||s.includes(q.toLowerCase()))&&(assetFolder==='All'||a.folder===assetFolder);}

function contentPanel(){

function railHTML(m){

    if(!page.length) return `<div class="stub"><h4>Outline</h4><div style="color:var(--gray-500);font-size:13px">Blank page — drag blocks from Content to build the outline.</div></div>`;

  }
  if(m==='files') return `<div class="stub"><h4>wknd-advanced · files</h4>${[['new-page','draft · you'],['index','page'],['nav','fragment'],['footer','fragment'],['metadata','sheet'],['placeholders','sheet']].map(([f,meta])=>`<div class="field" style="margin-bottom:6px"><div class="selctrl set">${f} <span style="color:var(--gray-500);font-weight:500;font-size:11px">${meta}</span></div></div>`).join('')}</div>`;
  if(m==='versions') return `<div class="stub"><h4>new-page · versions</h4>${[['Now','Autosave · you'],['Just now','Draft created'],['—','Not yet published']].map(([t,w])=>`<div class="field" style="margin-bottom:6px"><div class="selctrl set">${t} <span style="color:var(--gray-500);font-weight:500;font-size:11px">${w}</span></div></div>`).join('')}</div>`;

/* ---------------- RENDER RAIL ---------------- */
function renderRail(){
  if(railMode==='content'){ railbody.innerHTML=contentPanel(); wireContent(); }
  else if(railMode==='props'){ railbody.innerHTML=propsPanel(); wireProps(); }
  else { railbody.innerHTML=railHTML(railMode);
    if(railMode==='outline') railbody.querySelectorAll('[data-outline]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.outline)));
  }
}
function wireContent(){
  const cq=document.getElementById('cq'); if(cq){cq.addEventListener('input',e=>{q=e.target.value;const p=cq.selectionStart;renderRail();const n=document.getElementById('cq');if(n){n.focus();n.setSelectionRange(p,p);}});}
  railbody.querySelectorAll('[data-src]').forEach(el=>el.addEventListener('click',()=>{src=el.dataset.src;assetFolder='All';renderRail();}));
  railbody.querySelectorAll('[data-folder]').forEach(el=>el.addEventListener('click',()=>{assetFolder=el.dataset.folder;renderRail();}));
  railbody.querySelectorAll('[draggable=true]').forEach(el=>el.addEventListener('dragstart',e=>{
    const d={kind:el.dataset.kind};
    if(d.kind==='block')d.block=el.dataset.block;
    if(d.kind==='asset'){d.img=el.dataset.img;d.alt=el.dataset.alt;}
    if(d.kind==='fragment')d.idx=el.dataset.idx;
    e.dataTransfer.setData('text/plain',JSON.stringify(d));
  }));
}
function wireProps(){
  railbody.querySelectorAll('input[data-prop],textarea[data-prop]').forEach(inp=>inp.addEventListener('input',()=>{
    const b=page.find(x=>x.id===sel); if(!b)return; b.props[inp.dataset.prop]=inp.value; renderPage();
  }));
  railbody.querySelectorAll('[data-seg]').forEach(seg=>seg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    const b=page.find(x=>x.id===sel); if(!b)return; b.props[seg.dataset.seg]=btn.dataset.val;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn)); renderPage();
  })));
}

function renderBlock(b){
  const s=sel===b.id?'sel':'';
  if(b.type==='hero'){const p=b.props;const style=p.image?`background-image:url('${p.image}')`:'';
    const szmap={'2XL':'clamp(30px,4vw,44px)','XL':'34px','L':'27px','M':'21px'};
    const inner=p.image?`
      ${p.eyebrow?`<div class="eyebrow" style="text-align:${p.align}">${p.eyebrow}</div>`:''}
      <h1 style="font-size:${szmap[p.size]||'40px'};text-align:${p.align}">${p.headline||'Add a headline'}</h1>
      ${p.subhead?`<div class="subhead" style="text-align:${p.align}">${p.subhead}</div>`:''}
      ${p.cta?`<div class="hcta">${p.cta} ›</div>`:''}`
      :`<div class="imgdrop">🖼 Drop an image from <b>Assets</b> to set the hero background</div>
        <h1 style="font-size:28px;margin-top:12px;color:var(--gray-700)">${p.headline||'Add a headline'}</h1>`;
    return `<div class="cblock c-hero ${p.image?'':'noimg'} ${s}" data-id="${b.id}" data-drop="hero" style="${style}"><span class="blabel">Hero</span>${inner}</div>`;}
  if(b.type==='cards'){const items=b.props.items||[];
    return `<div class="cblock c-cards ${s}" data-id="${b.id}" data-drop="cards"><span class="blabel">Cards</span>
      ${b.props.heading?`<h2>${b.props.heading}</h2>`:'<h2>Trips Worth Taking</h2>'}
      <div class="c-cardrow">${items.map(it=>`<div class="tc"><div class="tcimg" style="background-image:url('${it.img}')"></div><div class="tcb"><b>${it.title}</b><p>${it.desc||''}</p>${it.cta?`<span class="cta">${it.cta} ›</span>`:''}</div></div>`).join('')}
        <div class="slot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Drag trip fragments here</div></div></div>`;}
  if(b.type==='image')return `<div class="cblock c-image ${s}" data-id="${b.id}"><span class="blabel">Image</span><img src="${b.props.url}" alt="${b.props.alt||''}"></div>`;
  if(b.type==='divider')return `<div class="cblock c-divider ${s}" data-id="${b.id}"><span class="blabel">Divider</span><hr></div>`;
  return `<div class="cblock c-generic ${s}" data-id="${b.id}" data-drop="generic"><span class="blabel">${b.props.label}</span><div class="gbox"><b>${b.props.label} block</b>Configure in Properties, or drag content in.</div></div>`;}

function renderPage(){
  pageEl.classList.toggle('pageselected', sel==='page');
  if(!page.length){
    pageEl.innerHTML=`<div class="emptystate" id="empty"><div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div><h3>Blank page · new-page</h3><p>Start by dragging a <b>block</b> from the Content panel. Then drop an <b>image</b> from Assets, edit text in <b>Properties</b>, and add <b>trip fragments</b> as cards.</p></div>`;
  } else {
    pageEl.innerHTML=page.map(renderBlock).join('');
  }
  wireCanvas();
}
function wireCanvas(){
  pageEl.querySelectorAll('.cblock').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();select(el.dataset.id);});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drophot');});
    el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('drophot');});
    el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('drophot');handleDrop(getData(e),el.dataset.id,el.dataset.drop);});
  });
  const empty=document.getElementById('empty');
  if(empty){['dragover'].forEach(()=>{});empty.addEventListener('dragover',e=>{e.preventDefault();empty.classList.add('hot');});empty.addEventListener('dragleave',()=>empty.classList.remove('hot'));empty.addEventListener('drop',e=>{e.preventDefault();empty.classList.remove('hot');handleDrop(getData(e),null,'page');});}
}
function getData(e){try{return JSON.parse(e.dataTransfer.getData('text/plain'));}catch(_){return null;}}
// clicking page background (not a block) selects page
pageEl.addEventListener('click',e=>{if(e.target===pageEl||e.target.id==='empty'||e.target.closest('#empty'))select('page');});
pageEl.addEventListener('dragover',e=>e.preventDefault());
pageEl.addEventListener('drop',e=>{if(e.target===pageEl){e.preventDefault();handleDrop(getData(e),null,'page');}});

/* ---------------- DROP LOGIC ---------------- */
function newBlock(kind){
  const id='b'+(uid++);
  if(kind==='hero')return{id,type:'hero',props:{eyebrow:'',headline:'',subhead:'',level:'H1',size:'2XL',align:'left',image:'',cta:''}};
  if(kind==='cards')return{id,type:'cards',props:{items:[],heading:''}};
  if(kind==='divider')return{id,type:'divider',props:{}};
  const labels={columns:'Columns',teaser:'Teaser',carousel:'Carousel',accordion:'Accordion',quote:'Quote',tabs:'Tabs',embed:'Embed',related:'Related Articles',table:'Table'};
  return{id,type:'generic',props:{label:labels[kind]||kind}};
}
function handleDrop(d,targetId,dropType){
  if(!d)return;
  if(d.kind==='block'){const b=newBlock(d.block);page.push(b);sel=b.id;renderPage();toast(`Added ${b.type==='hero'?'Hero':b.type==='cards'?'Cards':b.props.label} block`);return;}
  if(d.kind==='asset'){
    const tb=page.find(x=>x.id===targetId);
    if(tb&&tb.type==='hero'){tb.props.image=d.img;sel=tb.id;renderPage();if(railMode==='props')renderRail();toast('Set hero background image');return;}
    if(tb&&tb.type==='cards'){tb.props.items.push({img:d.img,title:d.alt||'Image',desc:'',cta:''});renderPage();toast('Added image card');return;}
    const b={id:'b'+(uid++),type:'image',props:{url:d.img,alt:d.alt}};page.push(b);sel=b.id;renderPage();toast('Added image');return;}
  if(d.kind==='fragment'){
    const t=TRIPS[+d.idx];const card={img:t.img,title:t.t,desc:t.d,cta:t.cta};
    let cb=page.find(x=>x.id===targetId&&x.type==='cards')||[...page].reverse().find(x=>x.type==='cards');
    if(!cb){cb=newBlock('cards');page.push(cb);}
    cb.props.items.push(card);sel=cb.id;renderPage();toast(`Added trip: ${t.t}`);return;}
}

/* ---------------- SELECTION ---------------- */
function select(id){sel=id;setMode('props');renderPage();}
function setMode(m){railMode=m;document.querySelectorAll('.railtab').forEach(x=>x.classList.toggle('on',x.dataset.mode===m));renderRail();}
document.getElementById('railtabs').addEventListener('click',e=>{const t=e.target.closest('.railtab');if(t)setMode(t.dataset.mode);});

let toastT;function toast(m){const el=document.getElementById('toast');document.getElementById('toasttext').textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000);}

renderPage(); renderRail();
</script>
</body>
</html>
